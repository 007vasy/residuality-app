# Builds the single-container Cloud Run image from Dockerfile.cloudrun.
# Invoked by setup.sh via: gcloud builds submit --config deploy/cloud-run/cloudbuild.yaml --substitutions _IMAGE=...
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.cloudrun", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
